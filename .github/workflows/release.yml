name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-preflight:
    uses: monarchic-langs/.github/.github/workflows/release.yml@main
    with:
      default_branch: monarchic
    secrets: inherit

  publish:
    needs: release-preflight
    uses: monarchic-langs/.github/.github/workflows/manual-command.yml@main
    with:
      command: |
        nix develop . -c bash -euo pipefail -c '
          rm -rf dist build *.egg-info
          export SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF_NAME#v}"
          python -m build --no-isolation --sdist --wheel
          python -m twine check dist/*
          TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_PYLS_TOKEN" python -m twine upload dist/*
        '
    secrets: inherit
